<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Showcase</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f6fc;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      margin: 30px 0 20px;
      padding: 12px;
      background: linear-gradient(90deg, #6a11cb, #2575fc);
      color: white;
      border-radius: 10px;
      font-size: 26px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
    }

    .faculty-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      margin-bottom: 40px;
    }

    .faculty-card {
      background: #ffffff;
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
      text-align: center;
      padding: 20px;
      width: 240px;
      transition: transform 0.3s ease;
    }

    .faculty-card:hover {
      transform: translateY(-6px);
    }

    .faculty-card img {
      width: 160px;
      height: 160px;
      border-radius: 15px;
      object-fit: cover;
      margin-bottom: 15px;
      background: #eef3fa;
      border: 6px double #2575fc;
      box-shadow: inset -3px -3px 6px #a1c4fd, inset 3px 3px 6px #2575fc;
    }

    .faculty-card input {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 8px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      text-align: center;
    }

    .faculty-card input:focus {
      border-color: #2575fc;
      box-shadow: 0px 0px 5px #6a11cb;
    }

    .faculty-card label {
      font-size: 14px;
      color: #444;
      display: block;
      margin-bottom: 3px;
    }
  </style>
</head>
<body>

  <!-- Dean Section -->
  <h2>Dean</h2>
  <div class="faculty-section">
    <div class="faculty-card">
      <img src="https://res.cloudinary.com/drz22hsjz/image/upload/v1757612700/IMG-20250911-WA0022_eygets.jpg" alt="Dean Image">
      <input type="text" placeholder="Dr.V.Sekar">
